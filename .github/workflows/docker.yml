# SmartPark KE: build + publish the image to GHCR.
# Triggers: push to main, version tags (v*), manual dispatch.
# Publishes ghcr.io/<owner>/<repo>:latest (+ branch-sha and tag variants).
# Needs only the default GITHUB_TOKEN (packages: write).
# How to run the image: DEPLOYMENT.md
name: Docker / GHCR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Smoke test published image
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image and probe health endpoints
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          ADMIN_USERNAME: manager
          ADMIN_PASSWORD: manager123
          FLASK_SECRET_KEY: smoke-test-only-secret
        run: |
          docker run -d --name smartpark-smoke -p 5000:5000 \
            -e FLASK_SECRET_KEY="$FLASK_SECRET_KEY" \
            -e ADMIN_USERNAME="$ADMIN_USERNAME" \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health/live >/dev/null; then break; fi
            sleep 2
            if [ "$i" = "30" ]; then echo "liveness probe failed"; docker logs smartpark-smoke; exit 1; fi
          done
          curl -fsS http://127.0.0.1:5000/health/ready
          curl -fsS http://127.0.0.1:5000/ | head -c 200
          docker logs smartpark-smoke
          docker rm -f smartpark-smoke
