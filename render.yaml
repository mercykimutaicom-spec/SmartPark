# SmartPark KE — Render Blueprint: always-on web service + Postgres + disk.
# autoDeploy:false is INTENTIONAL: pushes only reach Render after CI and the
# GHCR smoke test pass and the Deploy Hook is fired, keeping broken code offline.
# The disk keeps /app/data (SQLite fallback + backups); Postgres is the source of
# truth via DATABASE_URL. Disks need a paid instance type (starter or higher).
# Full setup steps: DEPLOYMENT.md -> "Render: run by itself".
services:
  - type: web
    name: smartpark-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Render injects PORT; the Dockerfile binds gunicorn to it (5000 locally).
    autoDeploy: false
    plan: starter
    healthCheckPath: /health/live
    disk:
      name: smartpark-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartpark-db
          property: connectionString
      - key: SQLITE_DB_PATH
        value: /app/data/smartpark.db
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: BACKUP_RETENTION_COUNT
        value: "14"
      - key: OVERSTAY_HOURS
        value: "8"
      # --- Fill once in Render dashboard (sync:false = Blueprint never overwrites) ---
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYHERO_AUTH_TOKEN
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_API_BASE_URL
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_CALLBACK_URL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: PAYPAL_KES_TO_CURRENCY_RATE
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      - key: BUSINESS_NAME
        value: SmartPark KE
      - key: BUSINESS_ADDRESS
        sync: false
      - key: KRA_PIN
        sync: false

databases:
  - name: smartpark-db
    databaseName: smartpark
    user: smartpark
    # Paid + persistent: the free Postgres tier expires after 30 days.
    plan: basic_256mb
